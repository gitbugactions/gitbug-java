name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black
      - name: Check formatting with black
        run: black --check gitbug-java gitbug test

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pygithub pygit2 fire tqdm junitparser pyyaml unidiff
      - name: Run basic tests
        run: |
          python -m pytest test/test_all.py::test_help -v
      - name: Verify CLI imports
        run: |
          python -c "from gitbug.bug import Bug; from gitbug.project import Project; print('Imports OK')"
      - name: Verify hash command works
        run: |
          python -c "import hashlib, json, os; print('Hash utilities OK')"
